name: temporary GPUI migration validation

on:
  push:
    branches:
      - tmp/gpui-migration-validation-20260808
    paths:
      - .github/validation/manifest.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpui-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch project snapshot
        shell: bash
        run: |
          mkdir -p validation/project
          cat .github/validation/project.tar.xz.b64.part* | base64 --decode > validation/project.tar.xz
          tar -xJf validation/project.tar.xz -C validation/project
          set +e
          bash .github/validation/apply-overlay.sh validation/project > validation/overlay.log 2>&1
          overlay=$?
          if [ "$overlay" -eq 0 ]; then
            bash .github/validation/apply-view-overlay.sh validation/project >> validation/overlay.log 2>&1
            overlay=$?
          fi
          set -e
          printf '%s\n' "$overlay" > validation/overlay.status
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libclang-dev pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libgtk-3-dev libayatana-appindicator3-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: validation/project
      - name: Format and validate
        shell: bash
        run: |
          set +e
          overlay=$(cat validation/overlay.status)
          cd validation/project
          cargo generate-lockfile > ../lock.log 2>&1
          lock=$?
          cargo fmt --all > ../format-write.log 2>&1
          format_write=$?
          cargo fmt --check > ../fmt.log 2>&1
          fmt=$?
          cargo check > ../check.log 2>&1
          check=$?
          cargo test > ../test.log 2>&1
          test=$?
          cargo build --release > ../release.log 2>&1
          release=$?
          if grep -RniE --exclude-dir='docs' '\biced\b' \
            Cargo.toml Cargo.lock README.md AGENTS.md MVP.md SPEC.md src .github > ../iced.log 2>&1; then
            iced=1
          else
            iced=0
          fi
          cd ../..
          printf 'run_id=%s\nhead_sha=%s\noverlay=%s\nlock=%s\nformat_write=%s\nfmt=%s\ncheck=%s\ntest=%s\nrelease=%s\niced=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$overlay" "$lock" "$format_write" "$fmt" "$check" "$test" "$release" "$iced" \
            | tee validation/results.txt
          rm -rf validation/project/target
          tar -cJf validation/formatted-project.tar.xz -C validation/project .
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-validation-linux
          path: |
            validation/formatted-project.tar.xz
            validation/results.txt
            validation/overlay.log
            validation/overlay.status
            validation/lock.log
            validation/format-write.log
            validation/fmt.log
            validation/check.log
            validation/test.log
            validation/release.log
            validation/iced.log
          if-no-files-found: warn
      - name: Publish validation output to branch
        if: always()
        shell: bash
        run: |
          set -e
          stage=/tmp/gpui-validation-output
          output=.github/validation/output
          rm -rf "$stage"
          mkdir -p "$stage"
          cp validation/results.txt "$stage/results.txt" || true
          cp validation/overlay.log validation/overlay.status validation/*.log "$stage/" || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin tmp/gpui-migration-validation-20260808
          git reset --hard origin/tmp/gpui-migration-validation-20260808
          rm -rf "$output"
          mkdir -p "$output"
          cp -a "$stage"/. "$output"/
          git add "$output"
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish GPUI validation output [skip ci]"
            git push origin HEAD:tmp/gpui-migration-validation-20260808
          fi
      - name: Fail on validation errors
        if: always()
        shell: bash
        run: |
          cat validation/results.txt
          ! grep -Eq '=[1-9][0-9]*$' validation/results.txt
