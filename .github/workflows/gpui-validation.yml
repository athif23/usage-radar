name: temporary GPUI migration validation

on:
  push:
    branches:
      - tmp/gpui-migration-validation-20260808
    paths:
      - .github/validation/project.zip.b64.part*
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore project snapshot
        run: |
          mkdir -p validation/project
          cat .github/validation/project.zip.b64.part* | base64 --decode > validation/project.zip
          unzip -q validation/project.zip -d validation/project
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libclang-dev pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libgtk-3-dev libayatana-appindicator3-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Format and validate
        shell: bash
        run: |
          set +e
          cd validation/project
          cargo generate-lockfile > ../lock.log 2>&1
          lock=$?
          cargo fmt --all > ../format-write.log 2>&1
          format_write=$?
          cargo fmt --check > ../fmt.log 2>&1
          fmt=$?
          cargo check > ../check.log 2>&1
          check=$?
          cargo test > ../test.log 2>&1
          test=$?
          cargo build --release > ../release.log 2>&1
          release=$?
          if grep -RniE --exclude='Cargo.lock' --exclude-dir='docs' '\biced\b' \
            Cargo.toml README.md AGENTS.md MVP.md SPEC.md src > ../iced.log 2>&1; then
            iced=1
          else
            iced=0
          fi
          cd ../..
          printf 'lock=%s\nformat_write=%s\nfmt=%s\ncheck=%s\ntest=%s\nrelease=%s\niced=%s\n' \
            "$lock" "$format_write" "$fmt" "$check" "$test" "$release" "$iced" \
            | tee validation/results.txt
          rm -rf validation/project/target
          (cd validation && zip -qr formatted-project.zip project)
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-validation-linux
          path: |
            validation/formatted-project.zip
            validation/results.txt
            validation/lock.log
            validation/format-write.log
            validation/fmt.log
            validation/check.log
            validation/test.log
            validation/release.log
            validation/iced.log
          if-no-files-found: warn
      - name: Fail on validation errors
        if: always()
        shell: bash
        run: |
          cat validation/results.txt
          ! grep -Eq '=(1|[2-9][0-9]*)$' validation/results.txt
