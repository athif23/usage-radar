name: temporary GPUI validation probe

on:
  push:
    branches:
      - tmp/gpui-migration-validation-20260808
    paths:
      - .github/validation/probe-trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish heartbeat
        shell: bash
        run: |
          mkdir -p .github/validation/output
          printf 'run_id=%s\nhead_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .github/validation/output/heartbeat.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/validation/output/heartbeat.txt
          git commit -m "ci: publish validation heartbeat [skip ci]"
          git push origin HEAD:tmp/gpui-migration-validation-20260808
